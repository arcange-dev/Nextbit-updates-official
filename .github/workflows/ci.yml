name: NextBit CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Check backend syntax
        run: node --check server/index.mjs && node --check server/db.mjs && node --check server/data.mjs && node --check server/news.mjs
      - name: Build frontend
        run: npm run build
