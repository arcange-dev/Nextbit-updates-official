name: NextBit CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Check all backend modules
        run: for file in server/*.mjs; do node --check "$file" || exit 1; done
      - name: Build frontend
        run: npm run build
