services:
  - type: web
    name: nextbit-updates
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        value: admin@nextbitupdates.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_RESET_TOKEN
        sync: false

