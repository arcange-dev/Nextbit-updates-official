services:
  - type: web
    name: nextbit-updates
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nextbit-updates-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: nextbit-updates-db
    region: frankfurt
    plan: free
    databaseName: nextbit_updates
    user: nextbit_app
